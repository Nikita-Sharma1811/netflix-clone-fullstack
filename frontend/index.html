<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Auth Pages -->
  <div id="auth-container" class="auth-container">
    <div class="auth-overlay"></div>

    <div id="login-page" class="auth-page active">
      <div class="auth-box">
        <h1 class="logo">NETFLIX</h1>
        <h2>Sign In</h2>
        <form id="login-form">
          <input type="email" id="login-email" placeholder="Email" required />
          <input type="password" id="login-password" placeholder="Password" required />
          <button type="submit" class="btn-primary">Sign In</button>
        </form>
        <p class="auth-switch">
          New to Netflix?
          <a href="#" id="show-signup">Sign up now</a>
        </p>
        <p id="login-error" class="error-msg"></p>
      </div>
    </div>

    <div id="signup-page" class="auth-page">
      <div class="auth-box">
        <h1 class="logo">NETFLIX</h1>
        <h2>Sign Up</h2>
        <form id="signup-form">
          <input type="text" id="signup-name" placeholder="Name" required />
          <input type="email" id="signup-email" placeholder="Email" required />
          <input type="password" id="signup-password" placeholder="Password" required />
          <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        <p class="auth-switch">
          Already have an account?
          <a href="#" id="show-login">Sign in</a>
        </p>
        <p id="signup-error" class="error-msg"></p>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-container" class="app-container hidden">
    <header class="navbar">
      <h1 class="logo">NETFLIX</h1>
      <nav>
        <button id="logout-btn" class="btn-secondary">Logout</button>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h2 id="welcome-text">Welcome back</h2>
        <p>Unlimited movies, TV shows, and more.</p>
      </div>
    </section>

    <main class="content">
      <section class="add-movie-section">
        <h3>Add New Movie</h3>
        <form id="add-movie-form" class="add-movie-form">
          <input type="text" id="movie-title" placeholder="Title" required />
          <input type="text" id="movie-genre" placeholder="Genre" />
          <input type="text" id="movie-image" placeholder="Image URL" />
          <input type="number" id="movie-rating" placeholder="Rating" min="0" max="10" step="0.1" />
          <textarea id="movie-description" placeholder="Description"></textarea>
          <button type="submit" class="btn-primary">Add Movie</button>
        </form>
        <p id="movie-msg" class="success-msg"></p>
      </section>

      <section class="movies-section">
        <h3>Trending Now</h3>
        <div id="movies-grid" class="movies-grid"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
